<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>dice-box-threejs demo</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: #121212;
			color: #eee;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			overflow: hidden;
		}

		#dice-box {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
		}

		#ui-bar {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			z-index: 10;
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 0.5rem;
			padding: 0.75rem 1rem;
			background: rgba(20, 20, 24, 0.85);
			backdrop-filter: blur(4px);
			border-bottom: 1px solid #333;
		}

		#ui-bar input[type="text"] {
			flex: 0 0 auto;
			width: 12rem;
			padding: 0.4rem 0.6rem;
			background: #1e1e22;
			border: 1px solid #444;
			border-radius: 4px;
			color: #eee;
			font-size: 0.9rem;
		}

		#ui-bar select {
			padding: 0.4rem 0.6rem;
			background: #1e1e22;
			border: 1px solid #444;
			border-radius: 4px;
			color: #eee;
			font-size: 0.9rem;
		}

		#ui-bar button {
			padding: 0.45rem 0.9rem;
			background: #2b6cb0;
			border: none;
			border-radius: 4px;
			color: #fff;
			font-size: 0.9rem;
			cursor: pointer;
		}

		#ui-bar button:hover {
			background: #3182ce;
		}

		#ui-bar button.secondary {
			background: #3a3a42;
		}

		#ui-bar button.secondary:hover {
			background: #4a4a54;
		}

		#result-bar {
			position: fixed;
			bottom: 0;
			left: 0;
			right: 0;
			z-index: 10;
			padding: 0.75rem 1rem;
			background: rgba(20, 20, 24, 0.85);
			backdrop-filter: blur(4px);
			border-top: 1px solid #333;
			font-size: 0.95rem;
			min-height: 1.2em;
		}

		#result-total {
			font-weight: bold;
			font-size: 1.1rem;
			color: #ffd54f;
		}

		#result-error {
			color: #ff6b6b;
		}

		#result-detail {
			color: #aaa;
			font-size: 0.85rem;
			margin-top: 0.25rem;
		}
	</style>
</head>
<body>
	<div id="dice-box"></div>

	<div id="ui-bar">
		<input type="text" id="notation-input" value="4d6+2d20" />
		<button id="roll-btn">Roll</button>
		<button id="add-btn" class="secondary">Add 2d8</button>
		<button id="addmulti-btn" class="secondary">Add fire+poison</button>
		<button id="reroll-btn" class="secondary">Reroll</button>
		<select id="colorset-select"></select>
		<button id="rollmulti-btn">Roll all damage types</button>
	</div>

	<div id="result-bar">
		<div id="result-total">Roll something!</div>
		<div id="result-detail"></div>
		<div id="result-error"></div>
	</div>

	<script type="module" src="./demo.js"></script>
</body>
</html>
