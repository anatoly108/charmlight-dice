<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dice rendering compatibility fixture</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #17151d; }
    #dice { width: 100%; height: 100%; }
  </style>
  <link rel="icon" href="data:,">
</head>
<body>
  <div id="dice"></div>
  <script type="module">
    import DiceBox from '/src/index.js';
    import { REVISION } from 'three';
    const material = new URLSearchParams(location.search).get('material') || 'metal';
    window.revision = REVISION;
    window.box = new DiceBox('#dice', {
      assetPath: '/',
      theme_customColorset: {
        name: 'Charmlight compatibility fixture',
        foreground: '#f4d899', background: '#48364e', outline: '#181220',
        texture: 'bronze01', material,
      },
    });
    window.ready = window.box.initialize();
  </script>
</body>
</html>
